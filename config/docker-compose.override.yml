# Experimento: 3 DataNodes con replicación 2
# Va en la misma carpeta que docker-compose.yaml; Docker Compose lo une automáticamente.
services:

  datanode2:
    image: ${DATANODE_IMAGE-ghcr.io/hadoop-sandbox/hadoop-hdfs-datanode:latest}
    volumes:
      - "./conf/hadoop:/hadoop/etc/hadoop:ro"
      - "hadoopnode2:/data"
      - "dnsocket2:/run/hadoop-hdfs"
    restart: always
    init: true
    hostname: hadoopnode2
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -f http://localhost:9864/ || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

  datanode3:
    image: ${DATANODE_IMAGE-ghcr.io/hadoop-sandbox/hadoop-hdfs-datanode:latest}
    volumes:
      - "./conf/hadoop:/hadoop/etc/hadoop:ro"
      - "hadoopnode3:/data"
      - "dnsocket3:/run/hadoop-hdfs"
    restart: always
    init: true
    hostname: hadoopnode3
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -f http://localhost:9864/ || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

volumes:
  hadoopnode2:
  dnsocket2:
  hadoopnode3:
  dnsocket3:
